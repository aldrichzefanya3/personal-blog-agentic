name: Generate AI Writer post

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-writer-production
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Request scheduled post generation
        env:
          AI_WRITER_CRON_SECRET: ${{ secrets.AI_WRITER_CRON_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$AI_WRITER_CRON_SECRET" ] || [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "AI_WRITER_CRON_SECRET and NEXT_PUBLIC_SITE_URL must be configured in the production GitHub environment."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${AI_WRITER_CRON_SECRET}" \
            "${NEXT_PUBLIC_SITE_URL%/}/api/ai-writer/run"
