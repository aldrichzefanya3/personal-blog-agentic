name: Deploy to Vercel

on:
  push:
    branches:
      - production
      - development

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'production' && 'production' || 'development' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: |
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --git-branch=development --token="$VERCEL_TOKEN"
          fi

      - name: Build production deployment
        if: github.ref_name == 'production'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build development preview
        if: github.ref_name == 'development'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        if: github.ref_name == 'production'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy development preview
        if: github.ref_name == 'development'
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
